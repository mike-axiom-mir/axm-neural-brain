name: AXM neural learning evaluation

on:
  push:
    paths:
      - "evaluation/**"
      - "axm_brain/**"
      - "neural/axm_brain/**"
      - ".github/workflows/neural-learning-evaluation.yml"
  pull_request:
    paths:
      - "evaluation/**"
      - "axm_brain/**"
      - "neural/axm_brain/**"
      - ".github/workflows/neural-learning-evaluation.yml"

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run independent learning evidence probes
        run: python -m unittest discover -s evaluation -p "test_*.py" -v
